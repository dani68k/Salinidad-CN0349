; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32-s3-devkitc-1-n32r8v

[env:esp32-s3-devkitc-1-n32r8v]
platform = espressif32
board = esp32-s3-devkitc-1-n32r8v
framework = arduino
lib_deps =
    h2zero/NimBLE-Arduino@^2.5.1

monitor_speed = 115200
monitor_echo = true
; Conservar las secuencias ANSI de clear para el terminal de VS Code.
monitor_filters = direct

[env:native]
platform = native
test_framework = unity
test_build_src = no
build_flags = -DUNITY_INCLUDE_DOUBLE
